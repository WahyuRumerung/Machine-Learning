<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Monitoring Banjir Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins'}

body{
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
  text-align:center;
}

h1{margin:20px}

/* CARD */
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:rgba(255,255,255,0.1);
  padding:20px;
  border-radius:20px;
}

.value{font-size:2em;margin:10px}

.normal{color:#2ecc71}
.siaga{color:#f1c40f}
.bahaya{color:#e74c3c}

/* CHART GRID */
.charts{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
  padding:20px;
}

.chart-box{
  background:rgba(255,255,255,0.1);
  padding:15px;
  border-radius:15px;
}

canvas{
  background:white;
  border-radius:10px;
}

/* TABLE */
table{
  width:90%;
  margin:20px auto;
  border-collapse:collapse;
  background:rgba(255,255,255,0.1);
}

th,td{
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,0.2);
}

th{background:rgba(0,0,0,0.3)}

/* ALERT */
#alertBox{
  position:fixed;
  top:20px;
  right:20px;
  background:#e74c3c;
  padding:15px 25px;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<h1>🌊 Monitoring Banjir</h1>
<!---
<div class="container">
  <div class="card">
    <h3>Tinggi Air</h3>
    <div id="air" class="value">-</div>
  </div>

  <div class="card">
    <h3>Status</h3>
    <div id="status" class="value">-</div>
  </div>

  <div class="card">
    <h3>Curah Hujan</h3>
    <div id="hujan" class="value">-</div>
  </div>
</div>
-->

<!-- 4 GRAFIK -->
<h2>📊 Dashboard Sensor</h2>

<div class="charts">

  <div class="chart-box">
    <h3>Ultrasonic 1</h3>
    <canvas id="chart1"></canvas>
  </div>

  <div class="chart-box">
    <h3>Ultrasonic 2</h3>
    <canvas id="chart2"></canvas>
  </div>

  <div class="chart-box">
    <h3>Water Level 1</h3>
    <canvas id="chart3"></canvas>
  </div>

  <div class="chart-box">
    <h3>Water Level 2</h3>
    <canvas id="chart4"></canvas>
  </div>

</div>

<!-- HISTORY -->
<h2>📊 History</h2>
<table>
<thead>
<tr>
<th>Waktu</th>
<th>U1</th>
<th>U2</th>
<th>WL1</th>
<th>WL2</th>
<th>Status</th>
<th>Hujan</th>
</tr>
</thead>
<tbody id="history"></tbody>
</table>

<div id="alertBox">⚠️ BAHAYA BANJIR!</div>

<script type="module">
import { db } from './firebase-config.js';
import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const airEl = document.getElementById("air");
const statusEl = document.getElementById("status");
const hujanEl = document.getElementById("hujan");
const historyEl = document.getElementById("history");
const alertBox = document.getElementById("alertBox");

// ===== FUNCTION BUAT CHART =====
function buatChart(id, label){
  return new Chart(document.getElementById(id), {
    type:"line",
    data:{
      labels:[],
      datasets:[{
        label:label,
        data:[],
        borderWidth:2,
        tension:0.3
      }]
    },
    options:{
      responsive:true,
      scales:{ y:{beginAtZero:true} }
    }
  });
}

const chart1 = buatChart("chart1","U1");
const chart2 = buatChart("chart2","U2");
const chart3 = buatChart("chart3","WL1");
const chart4 = buatChart("chart4","WL2");

// ===== REALTIME DATA =====
onValue(ref(db,"banjir"), (snap)=>{
  let d = snap.val();
  if(!d) return;
  airEl.innerText = d.tinggi_air + " cm";
  hujanEl.innerText = d.hujan;
  statusEl.innerText = d.status;

  statusEl.className = "value";
  if(d.status === "AMAN") statusEl.classList.add("normal");
  else if(d.status === "SIAGA") statusEl.classList.add("siaga");
  else statusEl.classList.add("bahaya");

  if(d.status === "BAHAYA"){
    alertBox.style.display="block";
    setTimeout(()=>alertBox.style.display="none",3000);
  }
});

// ===== HISTORY + CHART =====
onValue(ref(db,"history"), (snap)=>{
  let data = snap.val();
  if(!data) return;

  let arr = Object.values(data).slice(-20);

  let label = arr.map((_,i)=> i+1);

  chart1.data.labels = label;
  chart2.data.labels = label;
  chart3.data.labels = label;
  chart4.data.labels = label;

  chart1.data.datasets[0].data = arr.map(d=> d.u1 || 0);
  chart2.data.datasets[0].data = arr.map(d=> d.u2 || 0);
  chart3.data.datasets[0].data = arr.map(d=> d.wl1 || 0);
  chart4.data.datasets[0].data = arr.map(d=> d.wl2 || 0);

  chart1.update();
  chart2.update();
  chart3.update();
  chart4.update();

  // TABLE
  let html="";
  arr.slice().reverse().forEach(d=>{
    html += `
    <tr>
      <td>${d.waktu}</td>
      <td>${d.u1}</td>
      <td>${d.u2}</td>
      <td>${d.wl1}</td>
      <td>${d.wl2}</td>
      <td>${d.status}</td>
      <td>${d.hujan}</td>
    </tr>`;
  });

  historyEl.innerHTML = html;
});
</script>

</body>
</html>
